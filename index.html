<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#04060f">
<title>Unconscious Scrolling</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;}
  body{
    background:#0a0b14;
    display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
    color:#e8ecf7;
  }
  :root{
    --serif:"Baskerville","Hoefler Text","Iowan Old Style","Palatino Linotype",Palatino,"Songti SC",Georgia,"Times New Roman",serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }

  .phone{
    position:relative;
    height:min(100vh,880px);
    width:min(100vw, calc(min(100vh,880px) * 390 / 844));
    border-radius:44px;
    overflow:hidden;
    background:#04060f;
    box-shadow:0 50px 120px rgba(0,0,0,.85), 0 0 0 1px rgba(255,255,255,.09), inset 0 0 0 1px rgba(255,255,255,.04);
    user-select:none;
    touch-action:none;
  }
  @media (max-width:520px){
    .phone{border-radius:0;box-shadow:none;width:100vw;height:100vh;}
  }
  .screen{position:relative;width:100%;height:100%;overflow:hidden;}

  /* ---------- 胶片叠加 ---------- */
  .grain{
    position:absolute;inset:-45%;
    pointer-events:none;z-index:60;opacity:.46;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='160' height='160' filter='url(%23n)' opacity='0.62'/></svg>");
    mix-blend-mode:overlay;
    animation:grainShift .5s steps(1) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate(0,0);}
    20%{transform:translate(-2.4%,1.6%);}
    40%{transform:translate(1.7%,-2.2%);}
    60%{transform:translate(-1.2%,-1.9%);}
    80%{transform:translate(2.2%,1.1%);}
    100%{transform:translate(0,0);}
  }
  .scratches{
    position:absolute;inset:0;pointer-events:none;z-index:61;
    background:
      linear-gradient(90deg, transparent 11%, rgba(255,255,255,.55) 11.09%, transparent 11.2%),
      linear-gradient(90deg, transparent 67%, rgba(255,255,255,.4) 67.07%, transparent 67.18%),
      linear-gradient(90deg, transparent 87%, rgba(255,255,255,.32) 87.05%, transparent 87.14%);
    mix-blend-mode:screen;
    animation:scratch 2.9s steps(1) infinite;
  }
  @keyframes scratch{
    0%,100%{opacity:0;}
    15%{opacity:.3;}
    28%{opacity:.05;}
    47%{opacity:.22;}
    63%{opacity:.02;}
    82%{opacity:.16;}
  }
  .flicker{
    position:absolute;inset:0;pointer-events:none;z-index:59;
    background:#050a16;
    animation:flick 3.6s steps(1) infinite;
    mix-blend-mode:multiply;
  }
  @keyframes flick{
    0%,100%{opacity:.02;}
    11%{opacity:.09;}
    23%{opacity:0;}
    39%{opacity:.06;}
    57%{opacity:.01;}
    74%{opacity:.10;}
  }
  .vignette{
    position:absolute;inset:0;pointer-events:none;z-index:58;
    background:radial-gradient(118% 82% at 50% 46%, transparent 42%, rgba(2,4,12,.55) 88%, rgba(2,4,12,.93) 100%);
  }

  /* ---------- 字幕逐字动画 ---------- */
  .ch{
    display:inline-block;
    opacity:0;
    will-change:opacity, transform;
  }
  .ch.on{ animation: filmChar 3.4s steps(1,end) infinite; }
  @keyframes filmChar{
    0%   {opacity:1;   transform:translate3d(0,0,0);}
    6%   {opacity:.5;  transform:translate3d(0,.3px,0);}
    11%  {opacity:1;   transform:translate3d(0,0,0);}
    18%  {opacity:.76; transform:translate3d(-.2px,0,0);}
    24%  {opacity:1;   transform:translate3d(0,0,0);}
    31%  {opacity:.44; transform:translate3d(.18px,.18px,0);}
    37%  {opacity:1;   transform:translate3d(0,0,0);}
    48%  {opacity:.84; transform:translate3d(0,-.26px,0);}
    55%  {opacity:1;   transform:translate3d(0,0,0);}
    62%  {opacity:.58; transform:translate3d(-.18px,.22px,0);}
    69%  {opacity:1;   transform:translate3d(0,0,0);}
    81%  {opacity:.9;  transform:translate3d(.14px,0,0);}
    88%  {opacity:1;   transform:translate3d(0,0,0);}
    94%  {opacity:.7;  transform:translate3d(0,.18px,0);}
    100% {opacity:1;   transform:translate3d(0,0,0);}
  }
  .wd{display:inline-block;white-space:pre;}

  /* ================= 锁屏 = 第一句诗 ================= */
  .lock{
    position:absolute;inset:0;z-index:30;
    transition:transform .72s cubic-bezier(.32,.72,.16,1), opacity .6s ease;
  }
  .lock .wp{
    position:absolute;inset:-6% -4%;
    background-image:var(--wp);
    background-size:cover;background-position:center 42%;
    animation:drift 34s ease-in-out infinite alternate;
  }
  @keyframes drift{
    0%{transform:scale(1.06) translate3d(-0.6%,0.4%,0);}
    50%{transform:scale(1.1) translate3d(0.8%,-0.6%,0);}
    100%{transform:scale(1.07) translate3d(0.2%,0.8%,0);}
  }
  .lock .veil{
    position:absolute;inset:0;
    background:
      radial-gradient(58% 38% at 50% 48%, rgba(90,150,255,.14), transparent 72%),
      linear-gradient(to bottom, rgba(4,8,22,.52) 0%, rgba(3,6,18,.20) 34%, rgba(3,6,18,.34) 66%, rgba(2,4,12,.82) 100%);
  }

  .statusbar{
    position:absolute;top:0;left:0;right:0;height:52px;
    display:flex;align-items:center;justify-content:space-between;
    padding:14px 26px 0;z-index:40;
    font-size:14px;font-weight:600;letter-spacing:.02em;
    color:rgba(255,255,255,.94);text-shadow:0 1px 3px rgba(0,0,0,.5);
  }
  .sb-right{display:flex;align-items:center;gap:5px;}
  .sb-bars{display:flex;align-items:flex-end;gap:2px;height:11px;}
  .sb-bars i{width:3px;background:currentColor;border-radius:1px;display:block;}
  .sb-bars i:nth-child(1){height:4px;}
  .sb-bars i:nth-child(2){height:6px;}
  .sb-bars i:nth-child(3){height:8px;}
  .sb-bars i:nth-child(4){height:11px;}
  .batt{width:24px;height:12px;border:1.2px solid rgba(255,255,255,.75);border-radius:3.5px;position:relative;padding:1.4px;}
  .batt::after{content:"";position:absolute;right:-3.4px;top:3.4px;width:2px;height:5px;background:rgba(255,255,255,.6);border-radius:0 1px 1px 0;}
  .batt i{display:block;height:100%;width:72%;background:#fff;border-radius:1.6px;}

  .clock{
    position:absolute;top:66px;left:0;right:0;text-align:center;
    z-index:40;color:#fff;
    text-shadow:0 2px 26px rgba(90,140,255,.32), 0 1px 3px rgba(0,0,0,.45);
  }
  .clock .date{
    font-family:var(--serif);
    font-size:13px;letter-spacing:.10em;text-transform:uppercase;
    color:rgba(226,234,255,.8);margin-bottom:0;
  }
  .clock .time{
    font-family:var(--serif);
    font-size:70px;line-height:1.04;font-weight:300;
    letter-spacing:.012em;font-variant-numeric:tabular-nums;
    -webkit-text-stroke:0.5px rgba(255,255,255,.15);
  }
  .clock .time .sep{display:inline-block;animation:blink 2s steps(1) infinite;}
  @keyframes blink{0%,49%{opacity:.92;}50%,100%{opacity:.3;}}

  /* 锁屏正中的诗（第一句） */
  .lock-poem{
    position:absolute;left:0;right:0;top:50%;
    transform:translateY(-44%);
    padding:0 32px;
    z-index:41;
    text-align:center;
  }
  .lock-poem .lp{
    font-family:var(--serif);
    font-size:27px;line-height:1.52;
    color:#fdfaf2;
    margin:0;
    letter-spacing:.008em;
    text-shadow:0 2px 5px rgba(0,0,0,.9), 0 6px 38px rgba(80,130,255,.4);
  }
  .lock-poem .rule{
    width:40px;height:1px;background:rgba(238,242,252,.42);
    margin:24px auto 0;
  }

  .lock-foot{
    position:absolute;left:0;right:0;bottom:0;z-index:40;
    padding:0 26px 26px;text-align:center;
  }
  .swipe-up{
    display:flex;flex-direction:column;align-items:center;gap:9px;
    color:rgba(224,234,255,.6);
  }
  .swipe-up .bar{width:112px;height:4px;border-radius:99px;background:rgba(255,255,255,.55);}
  .swipe-up .hint{
    font-size:10px;letter-spacing:.26em;text-transform:uppercase;
    animation:breathe 3s ease-in-out infinite;
  }
  @keyframes breathe{0%,100%{opacity:.35;}50%{opacity:.95;}}
  .swipe-up .chev{
    width:9px;height:9px;border-left:1.4px solid currentColor;border-top:1.4px solid currentColor;
    transform:rotate(45deg);margin-top:-4px;
    animation:chev 2.4s ease-in-out infinite;
  }
  @keyframes chev{0%,100%{transform:translateY(2px) rotate(45deg);opacity:.4;}50%{transform:translateY(-3px) rotate(45deg);opacity:.95;}}



  /* ---------- 四方向入场动画 ---------- */
  /* 上滑：新页从下方推上来 */
  @keyframes pageInUp{
    0%{transform:translate3d(0,22%,0);opacity:0;}
    100%{transform:translate3d(0,0,0);opacity:1;}
  }
  /* 下滑：新页从上方压下来 */
  @keyframes pageInDown{
    0%{transform:translate3d(0,-22%,0);opacity:0;}
    100%{transform:translate3d(0,0,0);opacity:1;}
  }
  /* 左滑：新页从右侧推入 */
  @keyframes pageInLeft{
    0%{transform:translate3d(24%,0,0);opacity:0;}
    100%{transform:translate3d(0,0,0);opacity:1;}
  }
  /* 右滑：新页从左侧推入 */
  @keyframes pageInRight{
    0%{transform:translate3d(-24%,0,0);opacity:0;}
    100%{transform:translate3d(0,0,0);opacity:1;}
  }

  /* 锁屏玩法提示 */
  .howto{
    margin:0 auto 26px;
    max-width:250px;
  }
  .howto-row{
    display:flex;justify-content:center;gap:9px;margin-bottom:11px;
  }
  .howto-row .key{
    width:26px;height:26px;border-radius:7px;
    border:1px solid rgba(228,236,252,.34);
    background:rgba(12,20,42,.3);
    display:flex;align-items:center;justify-content:center;
    font-size:12px;color:rgba(236,242,255,.82);
    animation:keyPulse 3.2s ease-in-out infinite;
  }
  .howto-row .key:nth-child(1){animation-delay:0s;}
  .howto-row .key:nth-child(2){animation-delay:.24s;}
  .howto-row .key:nth-child(3){animation-delay:.48s;}
  .howto-row .key:nth-child(4){animation-delay:.72s;}
  @keyframes keyPulse{
    0%,100%{border-color:rgba(228,236,252,.28);box-shadow:0 0 0 rgba(140,180,255,0);}
    50%{border-color:rgba(200,222,255,.66);box-shadow:0 0 14px rgba(120,165,255,.28);}
  }
  .howto-text{
    font-family:var(--serif);
    font-size:12.5px;line-height:1.5;
    color:rgba(232,240,255,.86);
    margin:0 0 5px;letter-spacing:.02em;
    text-shadow:0 1px 8px rgba(0,0,0,.7);
  }
  .howto-sub{
    font-family:var(--mono);
    font-size:9px;letter-spacing:.2em;text-transform:uppercase;
    color:rgba(206,220,248,.42);
    margin:0;
  }

  .phone.unlocked .lock{ transform:translateY(-102%); opacity:0; }
  .phone.unlocked .lock .wp{animation-play-state:paused;}

  /* ================= 内容流 ================= */
  .feed{
    position:absolute;inset:0;z-index:10;
    opacity:0;pointer-events:none;
    background:#04060f;
    overflow:hidden;
  }
  .track{
    position:absolute;left:0;right:0;top:0;
    will-change:transform;
  }
  .page{
    position:absolute;left:0;right:0;top:0;
    height:var(--chpx);
    overflow:hidden;
    background:#04060f;
  }
  .page .art{position:absolute;inset:0;}
  .page .art svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
  .page .scrim{
    position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(to bottom, rgba(2,5,14,.62) 0%, rgba(2,5,14,0) 22%, rgba(2,5,14,.10) 50%, rgba(2,5,14,.72) 80%, rgba(2,5,14,.97) 100%),
      radial-gradient(82% 52% at 50% 42%, transparent 44%, rgba(2,4,12,.48) 100%);
  }

  /* TikTok 式文案区 */
  .copy{
    position:absolute;left:0;right:0;bottom:0;
    padding:0 78px 112px 16px;
    color:#f8f4ea;
    z-index:8;
  }
  .copy .who{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
  .copy .who .name{font-size:13px;font-weight:650;letter-spacing:.01em;color:#fff;}
  .copy .who .dot{width:3px;height:3px;border-radius:50%;background:rgba(255,255,255,.6);}
  .copy .who .meta{font-size:10.5px;color:rgba(230,236,250,.62);letter-spacing:.05em;}
  .copy .line{
    font-family:var(--serif);
    font-size:16.5px;line-height:1.56;
    color:#fbf8ef;
    letter-spacing:.006em;
    margin:0 0 9px;
    text-shadow:0 1px 3px rgba(0,0,0,.9), 0 4px 22px rgba(0,0,0,.6);
  }
  .copy .tags{
    display:flex;gap:8px;flex-wrap:wrap;
    font-size:11.5px;color:rgba(210,222,248,.78);letter-spacing:.01em;
  }
  .copy .tags b{font-weight:650;color:#dfe8ff;}
  .copy .sound{
    display:flex;align-items:center;gap:6px;margin-top:10px;
    font-size:11px;color:rgba(210,222,248,.66);
  }

  /* 右侧操作栏（TikTok） */
  .rail{
    position:absolute;right:8px;bottom:98px;
    display:flex;flex-direction:column;align-items:center;gap:16px;
    z-index:9;color:#fff;
  }
  .rail .btn{
    display:flex;flex-direction:column;align-items:center;gap:3px;
    filter:drop-shadow(0 2px 5px rgba(0,0,0,.7));
  }
  .rail svg{width:30px;height:30px;display:block;}
  .rail .cnt{font-size:10px;letter-spacing:.02em;color:rgba(240,244,255,.9);}
  .rail .avatar{
    width:44px;height:44px;border-radius:50%;
    border:1.5px solid rgba(240,244,255,.9);
    background:radial-gradient(circle at 34% 30%, #35529e, #070c1c 74%);
    display:flex;align-items:center;justify-content:center;
    font-family:var(--serif);font-style:italic;font-size:17px;color:#e2ebff;
    position:relative;margin-bottom:8px;
  }
  .rail .avatar::after{
    content:"+";position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);
    width:16px;height:16px;border-radius:50%;
    background:#e8446a;color:#fff;font-size:11px;line-height:15px;text-align:center;
    font-style:normal;font-family:system-ui,sans-serif;
  }
  .rail .disc{
    width:38px;height:38px;border-radius:50%;
    background:conic-gradient(from 0deg,#1c2c6e,#5574d4,#18285f,#3f5cbb,#1c2c6e);
    border:1px solid rgba(210,225,255,.55);
    animation:spin 6s linear infinite;
    position:relative;
  }
  .rail .disc::after{
    content:"";position:absolute;inset:38%;border-radius:50%;
    background:#04060f;border:1px solid rgba(210,225,255,.4);
  }
  @keyframes spin{to{transform:rotate(360deg);}}

  .progress-rail{
    position:absolute;left:0;right:0;bottom:88px;height:14px;
    display:flex;align-items:center;justify-content:center;gap:5px;z-index:9;
  }
  .progress-rail i{
    width:12px;height:2px;border-radius:2px;background:rgba(240,244,255,.24);
    transition:background .3s ease, width .3s ease;
  }
  .progress-rail i.on{background:rgba(248,246,240,.95);width:20px;}

  .feed-top{
    position:absolute;top:0;left:0;right:0;z-index:12;
    padding:14px 20px 0;
    display:flex;align-items:center;justify-content:center;gap:22px;
    font-size:13px;letter-spacing:.02em;
    color:rgba(230,238,252,.44);
    height:88px;
    background:linear-gradient(to bottom, rgba(3,6,16,.66), transparent);
    pointer-events:none;
  }
  .feed-top b{color:#fff;font-weight:650;position:relative;}
  .feed-top b::after{
    content:"";position:absolute;left:50%;bottom:-7px;width:16px;height:1.6px;
    background:#fff;transform:translateX(-50%);border-radius:2px;
  }

  /* ================= 终句页（纯色） ================= */
  .final-page{
    position:absolute;left:0;right:0;top:0;
    height:var(--chpx);
    background:#080a10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:0 42px;text-align:center;overflow:hidden;
  }
  .final-page::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(60% 40% at 50% 48%, rgba(100,128,196,.10), transparent 72%);
  }
  .final-page .fline{
    position:relative;
    font-family:var(--serif);
    font-size:22px;line-height:1.72;
    color:#f1ece0;font-style:italic;letter-spacing:.01em;
  }
  .final-page .fsub{
    position:relative;margin-top:46px;
    font-family:var(--mono);
    font-size:9px;letter-spacing:.3em;text-transform:uppercase;
    color:rgba(228,234,248,.26);
    opacity:0;transition:opacity 1.4s ease;
  }
  .final-page .fsub.on{opacity:1;animation:breathe 3.6s ease-in-out infinite;}

  /* ================= 汇总页 ================= */
  .poem-page{
    position:absolute;inset:0;z-index:20;
    background:#080a10;
    display:flex;flex-direction:column;
    opacity:0;pointer-events:none;
    transition:opacity .6s ease;
  }
  .poem-page::before{
    content:"";position:absolute;inset:0;
    background:radial-gradient(78% 48% at 50% 0%, rgba(90,118,184,.12), transparent 66%);
    pointer-events:none;
  }
  .poem-page.show{opacity:1;pointer-events:auto;}
  .poem-wrap{
    position:relative;flex:1;
    display:flex;flex-direction:column;
    padding:40px 28px 6px;
    min-height:0;
  }
  .poem-title{
    font-family:var(--serif);font-style:italic;
    font-size:21px;line-height:1.28;font-weight:400;
    color:#f6f2e7;margin:0 0 3px;letter-spacing:.01em;text-align:center;
  }
  .poem-sub{
    text-align:center;font-family:var(--mono);
    font-size:8.5px;letter-spacing:.34em;text-transform:uppercase;
    color:rgba(222,228,242,.28);margin:0 0 14px;
  }
  .poem-rule{width:32px;height:1px;background:rgba(228,234,248,.22);margin:0 auto 14px;}
  .poem-body{
    flex:1;min-height:0;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
  }
  .poem-body p{
    font-family:var(--serif);
    font-size:11.5px;line-height:1.68;margin:0;
    color:#ded9cd;letter-spacing:.004em;text-align:left;
  }
  .poem-body p.is-final{color:#a6b4dc;font-style:italic;}
  .poem-foot{position:relative;padding:6px 24px 20px;}
  .again{
    width:100%;padding:14px;
    border:1px solid rgba(234,238,248,.22);
    border-radius:12px;background:transparent;
    color:rgba(244,242,234,.9);
    font-family:var(--mono);font-size:10px;letter-spacing:.22em;text-transform:uppercase;
    cursor:pointer;transition:background .25s ease;
  }
  .again:active{background:rgba(244,242,234,.08);}
</style>
</head>

  const LINE_S = 'rgba(165,195,255,.42)';

  function contours(seed, n, opacity){
    n = n||26; opacity = (opacity==null?0.16:opacity);
    let out=''; let s = seed||1;
    const rand = ()=>{ s=(s*16807)%2147483647; return s/2147483647; };
    for(let i=0;i<n;i++){
      const cx = 50 + (rand()-0.5)*74;
      const cy = 48 + (rand()-0.5)*56;
      const rr = 7 + i*3.2 + rand()*4;
      const rot = rand()*360;
      const d = 'M '+(cx-rr).toFixed(2)+' '+cy.toFixed(2)+
        ' a '+rr.toFixed(2)+' '+(rr*0.72).toFixed(2)+' 0 1 0 '+(rr*2).toFixed(2)+' 0'+
        ' a '+rr.toFixed(2)+' '+(rr*0.72).toFixed(2)+' 0 1 0 '+(-rr*2).toFixed(2)+' 0';
      out += '<path d="'+d+'" transform="rotate('+rot.toFixed(1)+' '+cx.toFixed(2)+' '+cy.toFixed(2)+')" stroke="rgba(158,192,255,'+(opacity*(1-i/(n*1.6))).toFixed(3)+')" stroke-width="0.22" fill="none"/>';
    }
    return out;
  }
  function hatch(y0,y1,gap,op,color){
    let out='';
    for(let y=y0;y<y1;y+=gap){
      out += '<line x1="-10" y1="'+y.toFixed(1)+'" x2="110" y2="'+y.toFixed(1)+'" stroke="'+(color||LINE_S)+'" stroke-width=".28" opacity="'+(op==null?0.5:op)+'"/>';
    }
    return out;
  }
  function core(cx,cy,r,color){

      '<circle cx="'+cx+'" cy="'+cy+'" r="'+(r*1.7).toFixed(2)+'" fill="none" stroke="rgba(200,225,255,.28)" stroke-width=".4"/>';
  }
  function figure(x,y,s,op,flip){

  /* ==================================================================
     3. 老电影字幕
  ================================================================== */
  function esc(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function filmText(text, startDelay){
    let li = 0;
    return text.split(/(\s+)/).filter(s=>s.length).map(chunk=>{
      if(/^\s+$/.test(chunk)) return ' ';
      const letters = chunk.split('').map(c=>{
        const d = (startDelay||0) + li*44;
        li++;
        return '<span class="ch" style="animation-delay:'+d+'ms">'+esc(c)+'</span>';
      }).join('');
      return '<span class="wd">'+letters+'</span>';
    }).join('');
  }
  function playFilm(el){
    if(!el) return;
    el.querySelectorAll('.ch').forEach(c=>{
      c.classList.remove('on');
      void c.offsetWidth;
      c.classList.add('on');
    });
  }

  /* ==================================================================
     5. 状态与切页引擎
        —— 跟手位移 + 松手补全；方向与手势/键位严格一致
  ================================================================== */
  const state = { phase:'lock', picks:[], used:{up:0,down:0,left:0,right:0}, finalAt:0 };

  let lastReset = 0;       // 上次回到锁屏的时间，用来屏蔽"同一次点击"误触解锁
  let cur = null;          // 当前页面元素
  let curDir = null;       // 当前页面是由哪个方向进来的
  let anim = null;         // 进行中的过渡

  /* 进入方向 → 新页起始偏移（从手指来的反方向进入） */
  function enterOffset(dir){
    if(dir==='up')    return {x:0,       y: CH*0.55};   // 上滑：新页从下方进
    if(dir==='down')  return {x:0,       y:-CH*0.55};   // 下滑：新页从上方进
    if(dir==='left')  return {x: CW*0.62, y:0};         // 左滑：新页从右侧进
    if(dir==='right') return {x:-CW*0.62, y:0};         // 右滑：新页从左侧进
    return {x:0,y:0};
  }
  /* 退出方向 → 旧页位移（跟手指同向滑出） */
  function leaveOffset(dir){
    if(dir==='up')    return {x:0,        y:-CH*0.55};
    if(dir==='down')  return {x:0,        y: CH*0.55};
    if(dir==='left')  return {x:-CW*0.62, y:0};
    if(dir==='right') return {x: CW*0.62, y:0};
    return {x:0,y:0};
  }

  function applyXY(el, x, y, extra){
    el.style.transform = 'translate3d('+x.toFixed(2)+'px,'+y.toFixed(2)+'px,0)'+(extra||'');
  }

  /* 新版切页：旧页与位移同步滑出，新页从反侧滑入 */
  function showPage(pageEl, dir){
    const old = cur;
    const eo = enterOffset(dir);
    const lo = leaveOffset(dir);
    const DUR = 420;

    // 新页：先用 CSS 动画从入口位置滑到 0（动画有明确的关键帧，不受起始值合并影响）
    pageEl.style.transition = 'none';
    pageEl.style.transform = 'translate3d(0,0,0)';
    pageEl.style.opacity = '1';
    pageEl.style.animation = 'none';
    stage.appendChild(pageEl);
    cur = pageEl;
    curDir = dir;

    void pageEl.offsetWidth;

    const name = 'pageIn' + dir.charAt(0).toUpperCase() + dir.slice(1);
    pageEl.style.animation = name + ' ' + DUR + 'ms cubic-bezier(.22,.68,.24,1) both';

    // 旧页：顺着手指方向滑出
    if(old){
      old.style.transition = 'transform '+DUR+'ms cubic-bezier(.42,0,.58,1), opacity '+DUR+'ms ease';
      old.style.transform = 'translate3d('+lo.x+'px,'+lo.y+'px,0)';
      old.style.opacity = '0';
    }

    anim = { old:old, dur:DUR };

    clearTimeout(showPage._t);
    showPage._t = setTimeout(()=>{
      if(old && old.parentNode) old.parentNode.removeChild(old);
      pageEl.style.animation = '';
      pageEl.style.transform = 'translate3d(0,0,0)';
      pageEl.style.opacity = '1';
      anim = null;
    }, DUR + 40);

    playFilm(pageEl);
  }

  /* ==================================================================
     6. 手势：跟手位移，四方向严格对应
  ================================================================== */
  let g = null;

  function gestureStart(x,y){
    if(state.phase === 'poem') return;
    if(anim) return;                       // 过渡中不接受新手势
    g = { x0:x, y0:y, t0:performance.now(), x:x, y:y, axis:null };
  }

  function gestureMove(x,y){
    if(!g) return;
    g.x = x; g.y = y;
    const dx = x - g.x0, dy = y - g.y0;

    // 锁屏：只允许上推预览
    if(state.phase === 'lock'){
      const v = Math.min(0, dy);
      if(dy < -4){
        lockEl.style.transition = 'none';
        lockEl.style.transform = 'translateY('+v.toFixed(1)+'px)';
        lockEl.style.opacity = String(clamp(1 + v/460, 0.15, 1));
      }
      return;
    }

    if(state.phase !== 'play' && state.phase !== 'ending') return;

    // 锁定主轴：第一次超过 10px 决定是横还是纵
    if(!g.axis){
      if(Math.abs(dx) > 10 || Math.abs(dy) > 10){
        g.axis = Math.abs(dx) > Math.abs(dy) ? 'x' : 'y';
      }else{
        return;
      }
    }

    // 跟手：当前页跟着手指走，同时给出阻尼
    if(cur){
      cur.style.transition = 'none';
      if(g.axis === 'x'){
        applyXY(cur, dx*0.72, dy*0.08);
      }else{
        applyXY(cur, dx*0.08, dy*0.72);
      }
    }
  }

  function gestureEnd(){
    if(!g) return;
    const dx = g.x - g.x0, dy = g.y - g.y0;
    const dt = Math.max(1, performance.now() - g.t0);
    const speed = Math.max(Math.abs(dx), Math.abs(dy)) / dt;
    const axis = g.axis;
    g = null;

    if(state.phase === 'lock'){
      if(dy < -50 || (dy < -18 && speed > 0.28)){ unlock(); }
      else{
        lockEl.style.transition = 'transform .38s cubic-bezier(.32,.72,.16,1), opacity .38s ease';
        lockEl.style.transform = 'translateY(0)';
        lockEl.style.opacity = '1';
        setTimeout(()=>{ lockEl.style.transition = ''; }, 400);
      }
      return;
    }

    if(state.phase === 'poem') return;

    const ax = Math.abs(dx), ay = Math.abs(dy);
    if(ax < 10 && ay < 10) return;

    const TH = 52, FAST = 0.42;
    const pass = (axis==='x' ? ax : ay) > TH || speed > FAST;

    // 决定方向：位移优先，位移很小则看速度方向
    let dir = null;
    if(axis === 'x'){
      dir = dx < 0 ? 'left' : 'right';
    }else{
      dir = dy < 0 ? 'up' : 'down';
    }

    if(!pass){
      // 没过阈值：当前页弹回原位
      if(cur){
        cur.style.transition = 'transform .3s cubic-bezier(.32,.72,.16,1)';
        applyXY(cur, 0, 0);
        setTimeout(()=>{ if(cur) cur.style.transition=''; }, 320);
      }
      return;
    }

    // 过了阈值：先让当前页顺着手指方向滑出去，再切新页
    if(cur){
      const lo = leaveOffset(dir);
      cur.style.transition = 'transform .22s cubic-bezier(.4,0,.6,1), opacity .22s ease';
      applyXY(cur, lo.x*0.55, lo.y*0.55);
      cur.style.opacity = '0.3';
    }
    setTimeout(()=>{ turn(dir); }, 90);
  }

  /* 四个方向同一个动作：取出该方向的下一句 */
  function turn(dir){
    if(state.phase === 'ending'){
      if(Date.now() - state.finalAt > 650) goPoem();
      return;
    }
    if(state.phase === 'lock'){ unlock(); return; }
    if(state.phase !== 'play') return;

    if(state.picks.length >= MAX_TURNS){ showFinal(dir); return; }
    if(state.used[dir] >= POOL[dir].length){ nudge(dir); return; }

    const item = POOL[dir][state.used[dir]];
    state.used[dir]++;
    state.picks.push({ dir:dir, item:item });

    showPage(makePage(item, dir, state.picks.length), dir);
    refreshHud();
  }

  function nudge(dir){
    const el = document.querySelector('.dirhint span[data-d="'+dir+'"]');
    if(!el) return;
    el.classList.remove('nudge'); void el.offsetWidth; el.classList.add('nudge');
  }

  /* ==================================================================
     7. 终句 → 汇总
  ================================================================== */
  function showFinal(dir){
    state.phase = 'ending';
    const page = makePage(LAST, dir, state.picks.length);
    showPage(page, dir);
    state.finalAt = Date.now();
    setTimeout(()=>{
      const sub = page.querySelector('.fsub');
      if(sub) sub.classList.add('on');
    }, 900);
  }

  function goPoem(){
    if(state.phase === 'poem') return;
    state.phase = 'poem';
    buildPoem();
    poemPage.classList.add('show');
  }

  /* ==================================================================
     8. 汇总
  ================================================================== */
  function buildPoem(){
    const lines = [TITLE_LINE];
    state.picks.forEach(p=> lines.push(p.item.t));

    poemBody.innerHTML = '';
    const els = [];
    lines.forEach(txt=>{
      const el = document.createElement('p');
      el.textContent = txt;
      poemBody.appendChild(el);
      els.push(el);
    });
    const fin = document.createElement('p');
    fin.className = 'is-final';
    fin.textContent = LAST.t;
    poemBody.appendChild(fin);
    els.push(fin);

    fitPoem(els);

    els.forEach((el,i)=>{
      el.style.opacity = '0';
      el.style.transform = 'translateY(4px)';
      setTimeout(()=>{
        el.style.transition = 'opacity .55s ease, transform .55s cubic-bezier(.3,.8,.2,1)';
        el.style.opacity = '1';
        el.style.transform = 'none';
      }, 50 + i*62);
    });
  }

  function fitPoem(els){
    const available = poemBody.clientHeight;
    if(available <= 0) return;

    function mk(sz, lhh, gp){
      let total = 0;
      els.forEach(el=>{
        el.style.fontSize = sz.toFixed(2)+'px';
        el.style.lineHeight = lhh.toFixed(3);
        el.style.marginTop = '0';
        total += el.scrollHeight;
      });
      total += gp*(els.length-1);
      return total;
    }

    let size = 11.6, lh = 1.66, gap = 3.5;
    let total = mk(size, lh, gap);
    let guard = 0;
    while(total > available && size > 6.4 && guard < 60){
      size -= 0.18;
      lh = Math.max(1.4, lh - 0.004);
      if(size < 9.6) gap = 2;
      if(size < 8.2) gap = 1;
      total = mk(size, lh, gap);
      guard++;
    }
    let up = 0;
    while(total < available*0.93 && size < 11.8 && up < 24){
      const ns = size + 0.14;
      const nt = mk(ns, lh, gap);
      if(nt > available*0.995) break;
      size = ns; total = nt; up++;
    }
    els.forEach((el,i)=>{
      el.style.fontSize = size.toFixed(2)+'px';
      el.style.lineHeight = lh.toFixed(3);
      el.style.marginTop = (i===0 ? 0 : gap)+'px';
    });
  }

  /* ==================================================================
     9. 锁屏 / 重置
  ================================================================== */
  function unlock(){
    if(state.phase !== 'lock') return;
    state.phase = 'play';

    // 清掉手势预览留下的 inline 值，再交给过渡
    lockEl.style.transition = 'none';
    lockEl.style.transform = 'translateY(0)';
    lockEl.style.opacity = '1';
    void lockEl.offsetWidth;

    lockEl.style.transition = 'transform .68s cubic-bezier(.32,.72,.16,1), opacity .55s ease';
    lockEl.style.transform = 'translateY(-104%)';
    lockEl.style.opacity = '0';

    phone.classList.add('unlocked');
    feed.style.setProperty('opacity','1','important');
    feed.style.setProperty('pointer-events','auto','important');

    // 先放一张「入场卡」避免解锁后空白
    setTimeout(()=>{
      if(state.phase !== 'play') return;
      if(!cur){
        const first = makePage({ t:TITLE_LINE, s:'final' }, 'up', 0);
        // 第一张不消耗诗句，只是视觉上接住用户
        first.style.transition = 'none';
        first.style.transform = 'translate3d(0,0,0)';
        first.style.opacity = '1';
        first.style.animation = 'none';
        stage.appendChild(first);
        cur = first;
        void first.offsetWidth;
        // 两段式：先落位，下一帧再挂动画（避免与同帧样式合并）
        requestAnimationFrame(()=>{
          requestAnimationFrame(()=>{
            first.style.animation = 'pageInUp 520ms cubic-bezier(.22,.68,.24,1) both';
          });
        });
        setTimeout(()=>{
          first.style.animation = '';
          first.style.transform = 'translate3d(0,0,0)';
          first.style.opacity = '1';
        }, 600);
        playFilm(first);
      }
    }, 220);
  }

  function restart(){
    lastReset = Date.now();

    // 0) 先把状态切回 lock，避免解锁动画的回调干扰
    state.phase = 'lock';

    // 1) 汇总页收起
    poemPage.classList.remove('show');

    // 2) 清空内容流：先淡出，再清 DOM，避免闪烁
    feed.style.setProperty('opacity','0','important');

    // 3) 锁屏重新盖回来（先把 inline 样式清干净，靠 class 控制）
    //    注意：unlock() 给 lock 写了 inline transform/opacity，
    //    这里必须先移除 inline，再移除 .unlocked，才能让锁屏回到原位。
    lockEl.style.setProperty('transition','none');
    lockEl.style.setProperty('transform','translateY(0)');
    lockEl.style.setProperty('opacity','1');
    lockEl.style.setProperty('filter','none');
    phone.classList.remove('unlocked');
    void lockEl.offsetWidth;

    // 4) 清状态
    state.picks = [];
    state.used = {up:0,down:0,left:0,right:0};
    state.finalAt = 0;
    curDir = null;

    // 5) 立刻清掉内容流（它已经透明，用户看不到），避免残留卡片
    stage.innerHTML = '';
    cur = null;
    anim = null;

    // 6) 锁屏字幕重新跑
    const lp = document.getElementById('lockLine');
    if(lp){ lp.innerHTML = filmText(TITLE_LINE, 160); playFilm(lp); }
    refreshHud();

    // 7) 动画结束后再恢复过渡属性并断掉内容流交互
    setTimeout(()=>{
      lockEl.style.transition = '';
      feed.style.setProperty('pointer-events','none','important');
    }, 120);
  }

  function refreshHud(){
    document.querySelectorAll('.dirhint span').forEach(s=>{
      s.classList.toggle('spent', state.used[s.dataset.d] >= POOL[s.dataset.d].length);
    });
  }

  /* ==================================================================
     10. 时钟
  ================================================================== */
  const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
  const DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  function p2(n){ return n<10?('0'+n):(''+n); }
  function tickClock(){
    const d = new Date();
    const h = d.getHours(), m = d.getMinutes();
    const hh = h%12===0?12:h%12;
    const ct = document.getElementById('clockTime');
    if(ct) ct.innerHTML = hh + '<span class="sep">:</span>' + p2(m);
    const sb = document.getElementById('sbTime');
    if(sb) sb.textContent = hh + ':' + p2(m);
    const cd = document.getElementById('clockDate');
    if(cd) cd.textContent = DAYS[d.getDay()] + ', ' + MONTHS[d.getMonth()] + ' ' + d.getDate();
  }

  /* ==================================================================
     11. 输入
  ================================================================== */
  const KEYMAP = {ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right'};

  document.addEventListener('keydown', e=>{
    if(state.phase === 'poem'){
      if(KEYMAP[e.key] || e.key===' ' || e.key==='Enter'){ e.preventDefault(); restart(); }
      return;
    }
    const dir = KEYMAP[e.key];
    if(!dir) return;
    e.preventDefault();
    turn(dir);
  });

  let down = false;
  function onPD(e){
    if(e.target.closest('.poem-page')) return;
    down = true;
    const p = e.touches ? e.touches[0] : e;
    gestureStart(p.clientX, p.clientY);
  }
  function onPM(e){
    if(!down) return;
    const p = e.touches ? e.touches[0] : e;
    gestureMove(p.clientX, p.clientY);
  }
  function onPU(){ if(!down) return; down = false; gestureEnd(); }

  screenE.addEventListener('mousedown', onPD);
  window.addEventListener('mousemove', onPM);
  window.addEventListener('mouseup', onPU);
  screenE.addEventListener('touchstart', onPD, {passive:true});
  screenE.addEventListener('touchmove', onPM, {passive:true});
  screenE.addEventListener('touchend', onPU, {passive:true});
  screenE.addEventListener('touchcancel', onPU, {passive:true});
  screenE.addEventListener('click', ()=>{
    if(Date.now() - lastReset < 700) return;      // 刚从汇总页回来，忽略这次点击
    if(state.phase === 'lock') unlock();
  });
  againBt.addEventListener('click', function(e){
    // 阻止冒泡：否则同一次点击会落到 screenE 的「点击解锁」上，把锁屏又推开
    e.stopPropagation();
    restart();
  });

  (function(){
    const h = document.createElement('div');
    h.className = 'dirhint';
    h.style.cssText = 'position:absolute;left:50%;transform:translateX(-50%);bottom:34px;z-index:12;display:flex;gap:20px;color:rgba(226,234,250,.24);font-size:12px;pointer-events:none;';
    h.innerHTML = '<span data-d="up">↑</span><span data-d="down">↓</span><span data-d="left">←</span><span data-d="right">→</span>';
    feed.appendChild(h);
  })();

  /* ==================================================================
     12. 启动
  ================================================================== */
  let rt = null;
  window.addEventListener('resize', ()=>{
    clearTimeout(rt);
    rt = setTimeout(()=>{
      measure();
      if(state.phase === 'poem') fitPoem(Array.from(poemBody.querySelectorAll('p')));
    }, 140);
  });

  measure();
  tickClock();
  (function align(){
    const d = new Date();
    setTimeout(()=>{ tickClock(); setInterval(tickClock, 60000); }, (60-d.getSeconds())*1000);
  })();
  refreshHud();

  // 锁屏诗句：填字 + 跑电影字幕
  (function(){
    const lp = document.getElementById('lockLine');
    if(!lp) return;
    lp.innerHTML = filmText(TITLE_LINE, 180);
    playFilm(lp);
  })();

})();

</script>
